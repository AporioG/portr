[package]
name = "portr"
version = "0.1.0"
edition = "2021"
authors = ["gamer"]
description = "High-performance zero-overhead TUI network socket & process auditor for Linux"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
anyhow = "1.0"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
